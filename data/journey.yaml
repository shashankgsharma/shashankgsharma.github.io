    body: >-
      Four years of signals, networks and circuits before any of it was called machine
      learning. Graduated at 9.22, cleared GATE at 93.90 percentile, and left with the
      habit of asking what a system costs before asking what it can do.

  - id: iiitd
    x: 215
    y: 155
    label: "M.Tech · AI"
    sub: "2023–25"
    anchor: below
    title: "M.Tech, Computer Science (AI specialisation)"
    org: "IIIT Delhi"
    period: "2023 – 2025"
    body: >-
      Two years of coursework and research in AI, alongside teaching assistantships for
      NLP, DSA, AI and Intelligent Systems. The lab work split into two directions that
      only converged much later.

  - id: perception
    x: 415
    y: 70
    label: "Multimodal"
    sub: "2024"
    anchor: above
    title: "Multimodal perception at MIDAS Lab"
    org: "MIDAS Lab, IIIT Delhi · with Dr. Rajiv Ratn Shah"
    period: "Dec 2023 – Sept 2024"
    body: >-
      Crowd energy from audio and video, published at IEEE MIPR. Person attribute
      recognition for Indian street scenes, put on arXiv. Accident detection from live
      video with TU Darmstadt. All three had the same shape: a model that works offline,
      and a stream that will not wait for it.

  - id: language
    x: 415
    y: 240
    label: "Language"
    sub: "2025"
    anchor: below
    title: "Controllable summarisation"
    org: "IIIT Delhi · with Dr. Shad Akhtar"
    period: "Jan – Apr 2025"
    body: >-
      Perspective-controlled summarisation of healthcare threads, using classifier
      guidance and an energy term over adapters and prefix tuning. The interesting part
      was not the score. It was watching how little of a large model you actually need
      to move if you are precise about which part you move.

  - id: tcs
    x: 625
    y: 155
    label: "Neuromorphic"
    sub: "2025–"
    anchor: below
    current: true
    title: "Neuromorphic computing at TCS Research"
    org: "TCS Research, Kolkata · with Dr. Barnali Basak and Sounak Dey"
    period: "Sept 2025 – present"
    body: >-
      The main project is a bridge between general neuromorphic frameworks and
      hardware-specific ones: one spiking model, ported across SNNTorch, Rockpool, Lava
      and Sinabs, holding 96% accuracy within 2% of the reference. Building it meant
      first building real intuition for how SNNs behave — how event-based data should be
      handled, and where sparsity actually buys you something in multimodal tasks
      rather than just looking elegant on a slide.

  - id: now
    x: 800
    y: 155
    label: "Spiking LMs"
    sub: "now"
    anchor: below
    title: "Language modelling with spikes"
    org: "Current exploration"
    period: "Now"
    body: >-
      Language is the hard case for spiking networks, so that is where I am looking for
      the cracks. Alongside it I am working through adaptive-LIF neurons — how their
      threshold adaptation changes what a network can hold over time, and whether that
      is something I can bring back into the porting project rather than leave as a
      side experiment.

  - id: next
